<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Swing Scanner</title>
<style>
:root{--bg:#0a0a0a;--bg2:#111111;--bg3:#161616;--border:#1e1e1e;--border2:#252525;--text:#e0e0e0;--text2:#888;--text3:#555;--green:#2ecc71;--green-bg:#0a2e18;--red:#e74c3c;--red-bg:#2e0a0a;--amber:#f39c12;--amber-bg:#2e200a;--mono:'Courier New',Courier,monospace;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--mono);font-size:12px;min-height:100vh;padding:20px;}
.top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid var(--border);}
.logo{font-size:13px;font-weight:bold;letter-spacing:0.2em;color:var(--text);text-transform:uppercase;}
.live-dot{width:6px;height:6px;background:var(--green);border-radius:50%;display:inline-block;margin-right:6px;animation:blink 2s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
.ctrl-label{font-size:10px;color:var(--text3);letter-spacing:0.1em;}
select{background:var(--bg2);border:1px solid var(--border2);color:var(--text);font-family:var(--mono);font-size:11px;padding:4px 8px;border-radius:3px;cursor:pointer;}
.btn{background:transparent;border:1px solid var(--border2);color:var(--text2);font-family:var(--mono);font-size:11px;padding:4px 10px;border-radius:3px;cursor:pointer;transition:all 0.15s;}
.btn.active{border-color:var(--text2);color:var(--text);background:var(--bg3);}
.scan-btn{margin-left:auto;border-color:var(--green);color:var(--green);}
.scan-btn:disabled{opacity:0.4;cursor:not-allowed;}
.table-wrap{border:1px solid var(--border);border-radius:4px;overflow:hidden;margin-bottom:12px;}
.t-header{display:grid;grid-template-columns:90px 55px 1fr 65px 70px 75px 80px;padding:6px 12px;border-bottom:1px solid var(--border);background:var(--bg2);}
.th{font-size:10px;color:var(--text3);letter-spacing:0.1em;text-transform:uppercase;}
.pair-row{display:grid;grid-template-columns:90px 55px 1fr 65px 70px 75px 80px;padding:7px 12px;border-bottom:1px solid var(--border);align-items:center;cursor:pointer;transition:background 0.1s;}
.pair-row:hover{background:var(--bg3);}
.pair-name{font-size:12px;font-weight:bold;color:var(--text);letter-spacing:0.05em;}
.tf-tag{font-size:10px;color:var(--text3);}
.bar-track{height:3px;background:var(--border2);border-radius:2px;margin:0 8px;}
.bar-fill{height:100%;border-radius:2px;}
.candles{font-size:11px;color:var(--text2);text-align:right;}
.sr-tag{font-size:10px;padding:2px 6px;border-radius:2px;text-align:center;}
.sr-near{background:var(--amber-bg);color:var(--amber);}
.sr-mid{background:var(--bg3);color:var(--text3);}
.dir-badge{font-size:10px;font-weight:bold;padding:2px 8px;border-radius:2px;text-align:center;}
.dir-long{background:var(--green-bg);color:var(--green);}
.dir-short{background:var(--red-bg);color:var(--red);}
.dir-coil{background:var(--bg3);color:var(--text3);}
.detail-row{display:none;padding:8px 12px 8px 100px;background:var(--bg2);border-bottom:1px solid var(--border);gap:20px;flex-wrap:wrap;font-size:10px;color:var(--text3);}
.detail-row.open{display:flex;}
.status-bar{display:flex;gap:20px;padding:8px 0;font-size:10px;color:var(--text3);border-top:1px solid var(--border);}
.loading{padding:24px;text-align:center;color:var(--text3);}
.error-msg{padding:12px;background:var(--red-bg);color:var(--red);border-radius:3px;margin-bottom:12px;font-size:11px;}
.section-divider{padding:5px 12px;background:var(--bg2);border-bottom:1px solid var(--border);font-size:10px;color:var(--text3);text-transform:uppercase;}
</style>
</head>
<body>
<div class="top-bar">
<div class="logo"><span class="live-dot"></span>Swing Scanner</div>
<span style="font-size:11px;color:var(--text3)" id="scan-time">—</span>
</div>
<div id="error-area"></div>
<div class="controls">
<span class="ctrl-label">TF</span>
<select id="tf-sel" onchange="renderTable()"><option value="4h">H4</option><option value="1h">H1</option><option value="both" selected>H4+H1</option></select>
<span class="ctrl-label" style="margin-left:8px">Min candles</span>
<select id="min-candles" onchange="renderTable()"><option value="2">2+</option><option value="3" selected>3+</option><option value="4">4+</option><option value="6">6+</option></select>
<span class="ctrl-label" style="margin-left:8px">Bias</span>
<button class="btn active" onclick="setFilter(this,'all')">All</button>
<button class="btn" onclick="setFilter(this,'long')">Long</button>
<button class="btn" onclick="setFilter(this,'short')">Short</button>
<button class="btn" onclick="setFilter(this,'coil')">Coil</button>
<button class="btn scan-btn" id="scan-btn" onclick="runScan()">↻ Scan</button>
</div>
<div class="table-wrap">
<div class="t-header">
<span class="th">Pair</span><span class="th">TF</span><span class="th">Consolidation</span><span class="th" style="text-align:right">Candles</span><span class="th" style="text-align:right">S&amp;R</span><span class="th" style="text-align:right">Bias</span><span class="th" style="text-align:right">Strength</span>
</div>
<div id="table-body"><div class="loading">Click ↻ Scan to begin</div></div>
</div>
<div class="status-bar">
<div>Pairs: <strong id="s-total">28</strong></div>
<div>Consolidating: <strong id="s-cons">—</strong></div>
<div>Long: <strong id="s-long">—</strong></div>
<div>Short: <strong id="s-short">—</strong></div>
<div style="margin-left:auto">Last scan: <strong id="s-time">—</strong></div>
</div>
<script>
const PAIRS=['EUR/USD','GBP/USD','USD/JPY','USD/CHF','AUD/USD','USD/CAD','NZD/USD','EUR/GBP','EUR/JPY','GBP/JPY','AUD/JPY','CAD/JPY','CHF/JPY','NZD/JPY','EUR/CHF','EUR/AUD','EUR/CAD','EUR/NZD','GBP/CHF','GBP/AUD','GBP/CAD','GBP/NZD','AUD/CAD','AUD/CHF','AUD/NZD','CAD/CHF','NZD/CAD','NZD/CHF'];
let scanData=[],currentFilter='all';
async function runScan(){
const btn=document.getElementById('scan-btn');
btn.disabled=true;btn.textContent='↻ Scanning…';
document.getElementById('error-area').innerHTML='';
document.getElementById('table-body').innerHTML='<div class="loading">Fetching 28 pairs…</div>';
try{
const res=await fetch('/api/scan');
if(!res.ok)throw new Error('API error '+res.status);
const data=await res.json();
if(data.error)throw new Error(data.error);
scanData=data.pairs;
const now=new Date();
document.getElementById('scan-time').textContent=now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});
document.getElementById('s-time').textContent=now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
renderTable();
}catch(e){
document.getElementById('error-area').innerHTML='<div class="error-msg">'+e.message+'</div>';
document.getElementById('table-body').innerHTML='<div class="loading">Scan failed</div>';
}
btn.disabled=false;btn.textContent='↻ Scan';
}
function setFilter(el,dir){document.querySelectorAll('.btn:not(.scan-btn)').forEach(b=>b.classList.remove('active'));el.classList.add('active');currentFilter=dir;renderTable();}
function renderTable(){
if(!scanData.length)return;
const tf=document.getElementById('tf-sel').value;
const minC=parseInt(document.getElementById('min-candles').value);
let filtered=scanData.filter(d=>{const c=tf==='1h'?d.h1_candles:d.h4_candles;return c>=minC&&(currentFilter==='all'||d.bias===currentFilter);});
filtered.sort((a,b)=>b.strength-a.strength);
const longs=filtered.filter(d=>d.bias==='long');
const shorts=filtered.filter(d=>d.bias==='short');
const coils=filtered.filter(d=>d.bias==='coil');
let html='';
if(longs.length){html+='<div class="section-divider">Long setups ('+longs.length+')</div>';longs.forEach((d,i)=>html+=row(d,tf,'L'+i));}
if(shorts.length){html+='<div class="section-divider">Short setups ('+shorts.length+')</div>';shorts.forEach((d,i)=>html+=row(d,tf,'S'+i));}
if(coils.length){html+='<div class="section-divider">Coiling ('+coils.length+')</div>';coils.forEach((d,i)=>html+=row(d,tf,'C'+i));}
if(!html)html='<div class="loading">No matches</div>';
document.getElementById('table-body').innerHTML=html;
document.getElementById('s-cons').textContent=coils.length;
document.getElementById('s-long').textContent=longs.length;
document.getElementById('s-short').textContent=shorts.length;
}
function row(d,tf,id){
const c=tf==='1h'?d.h1_candles:tf==='4h'?d.h4_candles:d.h4_candles+'/'+d.h1_candles;
const col=d.bias==='long'?'#2ecc71':d.bias==='short'?'#e74c3c':'#555';
const dc=d.bias==='long'?'dir-long':d.bias==='short'?'dir-short':'dir-coil';
const dl=d.bias==='long'?'LONG':d.bias==='short'?'SHORT':'COIL';
return '<div class="pair-row" onclick="tog(\''+id+'\')"><span class="pair-name">'+d.pair+'</span><span class="tf-tag">'+(tf==='both'?'H4/H1':tf.toUpperCase())+'</span><div class="bar-track"><div class="bar-fill" style="width:'+d.strength+'%;background:'+col+'"></div></div><span class="candles">'+c+'</span><span style="text-align:right"><span class="sr-tag '+(d.near_sr?'sr-near':'sr-mid')+'">'+(d.near_sr?'SR':'—')+'</span></span><span style="text-align:right"><span class="dir-badge '+dc+'">'+dl+'</span></span><span style="font-size:11px;color:var(--text2);text-align:right">'+d.strength+'%</span></div><div class="detail-row" id="detail-'+id+'"><span>H4: <strong>'+d.h4_candles+'</strong></span><span>H1: <strong>'+d.h1_candles+'</strong></span><span>Range: <strong>'+d.range_pips+' pips</strong></span><span>S&amp;R: <strong>'+(d.near_sr?'Yes':'No')+'</strong></span><span>Trend: <strong>'+d.h4_trend+'</strong></span></div>';
}
function tog(id){const el=document.getElementById('detail-'+id);if(el)el.classList.toggle('open');}
</script>
</body>
</html>
